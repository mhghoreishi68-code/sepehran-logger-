<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Sepehran Logger</title>
<style>
  :root{
    --paper:#f2f2f3; --ink:#1d1f20; --line:rgba(29,31,32,.16); --acc:#5980a6;

    --warn:#8a5710; --warnSoft:#faf1e2; --btnInk:#f2f2f3;
    --head:"Barlow Condensed","Roboto Condensed",system-ui,sans-serif;
    --body:Barlow,Roboto,system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"Roboto Mono",Menlo,monospace;
  }
  html[data-theme="night"]{
    --paper:#1d2d3d; --ink:#eef6ff; --line:rgba(238,246,255,.24); --acc:#94bce3;
    --accSoft:rgba(238,246,255,.08); --muted:rgba(238,246,255,.62); --field:rgba(238,246,255,.07);
    --warn:#e8b866; --warnSoft:rgba(232,184,102,.14); --btnInk:#1d2d3d;
  }
  html[lang="fa"]{ --head:Vazirmatn,"Noto Naskh Arabic",Tahoma,system-ui,sans-serif;
                   --body:Vazirmatn,"Noto Naskh Arabic",Tahoma,system-ui,sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;
       overflow:hidden;-webkit-user-select:none;user-select:none}
  #app{height:100%;display:flex;flex-direction:column;
       padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  input,textarea,button{font-family:inherit;color:inherit;border-radius:0;-webkit-user-select:text;user-select:text}
  input,textarea{background:var(--field);border:1px solid var(--line)}
  input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-2px}
  button{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink)}
  button:active{opacity:.75}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .kick{font:600 10px/1.6 var(--mono);letter-spacing:.13em;color:var(--muted)}
  html[lang="fa"] .kick{letter-spacing:0;font-family:var(--body);font-size:11px}
  .h1{font:600 30px/1.1 var(--head)}
  .h2{font:600 22px/1.2 var(--head)}
  html[lang="fa"] .h1{font-size:26px;line-height:1.4}
  html[lang="fa"] .h2{font-size:20px;line-height:1.5}
  .row{display:flex;align-items:center;gap:10px}
  .primary{height:60px;width:100%;background:var(--acc);border:1px solid var(--acc);
           color:var(--btnInk);font:600 17px/1 var(--head);letter-spacing:.08em;text-transform:uppercase}
  html[lang="fa"] .primary{letter-spacing:0;text-transform:none;font-size:17px}
  .ghost{height:52px;font:600 15px/1 var(--head);letter-spacing:.06em;text-transform:uppercase}
  html[lang="fa"] .ghost{letter-spacing:0;text-transform:none}
  .seg{display:inline-flex;border:1px solid var(--line);flex:none}
  .seg button{border:0;padding:7px 9px;font:600 10px/1 var(--head);letter-spacing:.1em;background:transparent}
  .seg button.on{background:var(--acc);color:var(--btnInk)}
  .sweep{height:2px;background:var(--accSoft);overflow:hidden;width:190px}
  .sweep i{display:block;width:30%;height:100%;background:var(--acc);animation:sweep 1.6s linear infinite}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
  @keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}
  .dot{width:7px;height:7px;background:var(--acc);display:block;animation:blip 2s ease-in-out infinite}
  .hd{padding:12px 16px 13px;border-bottom:1px solid var(--line)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);
        font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--muted)}
  html[lang="fa"] .chip{font-family:var(--body);letter-spacing:0}
  .chip.on{border-color:var(--acc);color:var(--acc)}
  .chip.bad{background:var(--warn);border-color:var(--warn);color:var(--paper)}
  .card{border:1px solid var(--line);padding:12px 13px 13px}
  .card.bad{border-color:var(--warn);background:var(--warnSoft)}

  .tiles>div{border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 13px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  .meta div{display:flex;justify-content:space-between;gap:8px;font:500 10.5px/1.8 var(--mono)}
  html[lang="fa"] .meta div{font-family:var(--body);font-size:11.5px}
  .meta span:first-child{color:var(--muted)}
  .listrow{display:flex;align-items:center;gap:13px;padding:13px 2px;min-height:60px;border-bottom:1px solid var(--line)}
  .plate{flex:none;width:66px;padding:7px 0;text-align:center;border:1px solid var(--line);
         font:500 12px/1 var(--mono);color:var(--acc);direction:ltr}
  .sticky{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:13px 16px 16px}
  .modal{position:fixed;inset:0;background:rgba(29,45,61,.6);display:flex;align-items:center;
         justify-content:center;padding:22px;z-index:20}
  .sheet{background:var(--paper);border:1px solid var(--ink);padding:19px;width:100%;max-width:420px}

<!-- Shared data + authentication layer: the same file the web admin loads, so
     both applications read one user table and one master-data store. Absent in
     a stage-1 APK build, in which case the app runs on the native bridge alone. -->
<script src="sepehran-core.js" data-client="mobile"></script>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   Sepehran Logger — WebView UI.
   Layers stay separate so each can be replaced by Kotlin later:
     Native  — SepehranAndroid bridge (NFC, camera, storage, audit)
     Domain  — validate() / submitGuard(): the only place a value is judged
     I18N    — every user-facing string; no literals in the views
     Data    — MASTER: equipment, parameters, equipment-parameter join
     UI      — screens[], render()
   ────────────────────────────────────────────────────────────────────────── */

/* ── Shared core ───────────────────────────────────────────────────────────
   One user table and one master-data store, shared with the web admin.
   Null when the file is not bundled; the app then keeps working offline
   against the native bridge with whatever master data it already holds. */
const Core = window.SepehranCore || null;

/* ── Native bridge ─────────────────────────────────────────────────────── */
const Native = (() => {
  const A = window.SepehranAndroid, has = !!A;
  const j = (fn, d) => { try { return JSON.parse(fn()); } catch (e) { return d; } };
  return {
    has,
    device: () => has ? j(A.deviceInfo, {}) : { model: "browser", appVersion: "preview" },
    now: () => has ? j(A.now, null) : (() => {
      const d = new Date(), p = n => String(n).padStart(2, "0");
      return { epochMillis: +d, iso: d.toISOString(),
               time: `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,
               date: d.toISOString().slice(0, 10) };
    })(),
    nfcState: () => has ? A.nfcState() : "ABSENT",
    openNfcSettings: () => has && A.openNfcSettings(),
    capturePhoto: t => has ? A.capturePhoto(t)
      : setTimeout(() => window.SepehranNative.onPhotoCaptured(
          { token: t, path: "(preview)", name: "IMG_" + t + ".jpg", bytes: 214000 }), 250),
    deletePhoto: p => has && A.deletePhoto(p),
    saveRecord: o => has ? JSON.parse(A.saveRecord(JSON.stringify(o)))
                         : { ...o, id: "local-" + Date.now(), syncState: "PENDING" },
    saveDraft: o => has && A.saveDraft(JSON.stringify(o)),
    loadDraft: () => { if (!has) return null; try { return JSON.parse(A.loadDraft() || "null"); } catch (e) { return null; } },
    clearDraft: () => has && A.clearDraft(),
    pending: () => has ? j(A.pendingRecords, []) : [],
    setSessionUser: (c, n, s) => has && A.setSessionUser(c, n, s),
    audit: (a, e) => has && A.audit(a, e || ""),
    theme: () => has ? A.theme() : (localStorage.getItem("theme") || "light"),
    setTheme: t => has ? A.setTheme(t) : localStorage.setItem("theme", t),
    toast: m => has ? A.toast(m) : console.log("toast:", m),
    tick: () => has && A.tick(),
    exit: () => has && A.exitApp()
  };
})();

/* ── Domain ────────────────────────────────────────────────────────────── */
// Mirrors RangeValidator in :domain and ops.spIngestCollectionRecord on the server.
function validate(raw, min, max, warnMin, warnMax, dataType, expectedBool) {
  const text = (raw ?? "").toString().trim();
  if (!text) return "NOT_ENTERED";
  if (dataType === "BOOLEAN") {
    if (text !== "true" && text !== "false") return "INVALID";
    if (expectedBool === null || expectedBool === undefined) return "NORMAL";
    return (text === "true") === !!expectedBool ? "NORMAL" : "ABNORMAL";
  }
  if (dataType === "TEXT") return "NORMAL";
  const v = Number(text);
  if (!isFinite(v)) return "INVALID";
  if (min == null || max == null || min >= max) return "NORMAL";
  if (warnMin != null && v < warnMin) return "CRITICAL";
  if (warnMax != null && v > warnMax) return "CRITICAL";
  if (v < min || v > max) return "ABNORMAL";
  return "NORMAL";
}
// Blocks only on missing required values, invalid input and missing required photos.
// An out-of-range value is never a reason to refuse a submission.
function submitGuard(rows, state) {
  const missVal = [], missPhoto = [], invalid = [];
  rows.forEach(r => {
    const st = validate(state.values[r.code], r.min, r.max, null, null, r.dataType, r.expectedBool);
    if (r.required && st === "NOT_ENTERED") missVal.push(r.code);
    if (st === "INVALID") invalid.push(r.code);
    if (r.photo === "REQUIRED" && st !== "NOT_ENTERED" && !state.photos[r.code]) missPhoto.push(r.code);
  });
  const p = [];
  if (missVal.length) p.push(T("gMissVal", { n: missVal.length, list: missVal.slice(0, 3).join("، ") + (missVal.length > 3 ? "…" : "") }));
  if (invalid.length) p.push(T("gInvalid", { list: invalid.join("، ") }));
  if (missPhoto.length) p.push(T("gMissPhoto", { list: missPhoto.join("، ") }));
  return { ok: p.length === 0, message: p.join(" ") };
}

// Distinct parameters assigned across the equipment this operator can see.
function paramCount() {
  if (!Core) return 0;
  return Core.list("parameter", { status: "ACTIVE" }).length;
}

function syncMasterFromCore() {
  if (!Core) return;
  const sites = Core.list("site", { status: "ACTIVE" });
  MASTER.sites = sites.map(s => ({ code: s.siteCode, nameEn: s.nameEn, nameFa: s.nameFa, id: s.id }));

  const siteCode = id => { const s = sites.find(x => x.id === id); return s ? s.siteCode : null; };

  MASTER.groups = Core.list("group", { status: "ACTIVE" })
    .map(g => ({ code: g.groupCode, site: siteCode(g.siteId), nameEn: g.nameEn, nameFa: g.nameFa, id: g.id }));

  const areas = Core.list("area", { status: "ACTIVE" });
  MASTER.areas = ["All"].concat(areas.map(a => a.nameEn));
  MASTER.areaFa = { All: "همه" };
  areas.forEach(a => { MASTER.areaFa[a.nameEn] = a.nameFa; });

  MASTER.equipment = Core.list("equipment", { status: "ACTIVE" }).map(e => {
    const type = e.equipmentTypeId ? Core.get("equipmentType", e.equipmentTypeId) : null;
    const area = e.areaId ? Core.get("area", e.areaId) : null;
    const grp = e.groupId ? Core.get("group", e.groupId) : null;
    const doneToday = Core.list("record").some(r =>
      r.equipmentId === e.id && new Date(r.submittedAt).toDateString() === new Date().toDateString());
    return {
      coreId: e.id, tag: e.tagNumber, code: e.equipmentCode,
      site: siteCode(e.siteId), group: grp ? grp.groupCode : null,
      nameEn: e.nameEn, nameFa: e.nameFa,
      type: type ? type.nameEn : "—", typeFa: type ? type.nameFa : "—",
      area: area ? area.nameEn : "All", unit: e.location || "—", loc: e.location || "—",
      crit: e.criticality || "MEDIUM", nfc: e.nfcTagId || "",
      status: doneToday ? "DONE" : "DUE"
    };
  });
}

entry: () => {

  if (!eq) { setTimeout(() => setS({ screen: "search", tab: "search" }), 0); return ""; }

  const meta = [
    [T("mSite"), MASTER.siteLabel(eq.site)], [T("mGroup"), MASTER.groupName(eq.group) || T("noGroup")],
    [T("mType"), MASTER.eqType(eq)], [T("mArea"), MASTER.areaName(eq.area)],
    [T("mUnit"), eq.unit], [T("mLoc"), eq.loc],
    [T("mDate"), nums(n.date)], [T("mTime"), nums(n.time.slice(0, 5))],
    [T("mOperator"), S.session?.name || "M. Rahimi"], [T("mPers"), nums(S.session?.code || "10428")],
    [T("mShift"), S.session?.shift || "B · 06:00–14:00"], [T("mInterval"), T("every2h")]
  ];
  return `<div class="hd">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <button data-act="back" style="flex:none;width:40px;height:40px;margin:-4px 0 0 0;margin-inline-start:-8px;border:0;display:flex;align-items:center;justify-content:center">${ico.back}</button>

            <span class="chip on" style="flex:none;white-space:nowrap;font-size:9.5px;padding:3px 7px">✓ ${T(S.identifiedBy === "NFC" ? "identifiedNfc" : "identifiedSearch")}</span></div>
          <div style="font:500 15px/1.5 var(--body)">${esc(MASTER.eqName(eq))}</div>
          <div dir="${S.lang === "fa" ? "ltr" : "rtl"}" style="font:400 13.5px/1.7 var(--body);color:var(--muted)">${esc(S.lang === "fa" ? eq.nameEn : eq.nameFa)}</div></div>
        ${themeOnly()}
      </div>
      <div class="meta">${meta.map(m => `<div><span>${esc(m[0])}</span><span>${esc(m[1])}</span></div>`).join("")}</div>
    </div>

    <div class="scroll" style="padding:14px 16px 0">
      <div class="row" style="justify-content:space-between">
        <span class="kick">${T("paramsCount", { n: nums(entered()), total: nums(rows.length) })}</span>
        ${abnormal() ? `<span class="kick" style="color:var(--warn)">${T("abnormalCount", { n: nums(abnormal()) })}</span>` : ""}
      </div>

      ${S.blocker ? `<div class="card bad" style="margin-top:10px">
        <div style="font:600 15px/1.5 var(--head);color:var(--warn)">${T("cannotSave")}</div>
        <div style="margin-top:4px;font:400 12.5px/1.6 var(--body);color:var(--warn)">${esc(S.blocker)}</div></div>` : ""}

      ${rows.length === 0 ? `<div class="empty">${ico.data}
        <div class="h2">${T("noParams")}</div>
        <div class="note" style="max-width:280px">${T("noParamsSub")}</div></div>` : ""}

      <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      ${rows.map(r => {
        const raw = S.values[r.code] ?? "", st = statusOfRow(r);
        const isBool = r.dataType === "BOOLEAN", isText = r.dataType === "TEXT";
        const bad = st === "ABNORMAL" || st === "CRITICAL", empty = st === "NOT_ENTERED";
        const label = isBool
          ? (st === "NORMAL" ? T("stMatches") : bad ? T("stDiffers") : empty ? T("stEmpty") : T("stInvalid"))
          : T({ CRITICAL: "stCritical", ABNORMAL: "stAbnormal", NORMAL: "stNormal", INVALID: "stInvalid", NOT_ENTERED: "stEmpty" }[st]);
        const shot = S.photos[r.code], u = MASTER.pUnit(r);
        const onWord = r.code === "BL-103" ? T("on") : T("yes");
        const offWord = r.code === "BL-103" ? T("off") : T("no");

        // Data type decides the control — nothing is forced into a numeric field.
        let control;
        if (isBool) {
          const isYes = raw === "true", isNo = raw === "false";
          control = `<div style="display:flex;gap:9px">
            <button data-act="bool" data-v="${esc(r.code)}" data-b="true"
              style="flex:1;height:58px;font:600 18px/1 var(--head);${isYes ? (r.expectedBool === true ? "background:var(--acc);border-color:var(--acc);color:var(--btnInk)" : "background:var(--warn);border-color:var(--warn);color:var(--paper)") : ""}">${onWord}</button>
            <button data-act="bool" data-v="${esc(r.code)}" data-b="false"
              style="flex:1;height:58px;font:600 18px/1 var(--head);${isNo ? (r.expectedBool === false ? "background:var(--acc);border-color:var(--acc);color:var(--btnInk)" : "background:var(--warn);border-color:var(--warn);color:var(--paper)") : ""}">${offWord}</button>
          </div>`;
        } else if (isText) {
          control = `<input class="val" data-p="${esc(r.code)}" value="${esc(raw)}" placeholder="${esc(T("textPh"))}"
            style="width:100%;font:400 16px/1 var(--body);direction:inherit;text-align:start;border-color:${empty ? "var(--line)" : "var(--acc)"}">`;
        } else {
          control = `<div class="row" style="align-items:stretch;gap:9px">
            <input class="val" data-p="${esc(r.code)}" inputmode="decimal" value="${esc(raw)}" placeholder="—"
              style="border-color:${bad ? "var(--warn)" : empty ? "var(--line)" : "var(--acc)"}">
            <div class="unit">${esc(u || "—")}</div></div>`;
        }

        const subline = isBool
          ? T("expected", { v: r.expectedBool ? onWord : offWord }) + " · " + (r.required ? T("required") : T("optional"))
          : isText
            ? (r.required ? T("required") : T("optional"))
            : T("normalRange", { min: fmt(r.min, r.dec), max: fmt(r.max, r.dec), unit: u ? " " + u : "" }) + " · " + (r.required ? T("required") : T("optional"));

        return `<div class="card ${bad ? "bad" : ""}">
          <div class="row" style="justify-content:space-between;align-items:baseline">
            <div style="font:500 15.5px/1.5 var(--body)">${esc(MASTER.pName(r))}</div>
            <div class="ltr" style="font:500 10.5px/1 var(--mono);color:var(--muted)">${esc(r.code)}</div></div>
          <div style="margin-top:3px;font:400 11.5px/1.6 var(--body);color:var(--muted)">${esc(subline)}</div>
          <div style="margin-top:10px">${control}</div>
          <div class="row" style="margin-top:9px;flex-wrap:wrap;gap:9px">
            <span class="chip ${bad ? "bad" : empty ? "" : "on"}">${esc(label)}</span>
            ${r.photo !== "DISABLED" ? `<button data-act="photo" data-v="${esc(r.code)}" style="display:inline-flex;align-items:center;gap:7px;padding:9px 11px;font:500 11.5px/1 var(--body);${r.photo === "REQUIRED" && !shot ? "border-color:var(--warn);color:var(--warn)" : ""}">${ico.cam}${shot ? T("photoAttached") : r.photo === "REQUIRED" ? T("photoRequired") : T("addPhoto")}</button>` : ""}
          </div>
          ${bad ? `<div style="margin-top:10px;border-top:1px solid var(--warn);padding-top:9px;display:flex;gap:9px">${ico.warn}
            <div style="font:400 12.5px/1.6 var(--body);color:var(--warn)"><b>${isBool ? T("boolAbnormal") : T("outOfRange")}</b>
            ${isBool
              ? T("boolAbnormalBody", { exp: r.expectedBool ? onWord : offWord, got: raw === "true" ? onWord : offWord })
              : T("outOfRangeBody", { v: nums(raw), unit: esc(u), min: fmt(r.min, r.dec), max: fmt(r.max, r.dec), unitSuffix: u ? " " + u : "" })}</div></div>` : ""}
          ${shot ? `<div class="row" style="margin-top:10px;border:1px solid var(--line);padding:8px 10px">
            <div style="width:38px;height:38px;flex:none;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--acc)">${ico.cam}</div>
            <div style="flex:1;min-width:0"><div class="ltr" style="font:500 11px/1.4 var(--mono)">${esc(shot.name)}</div>
            <div class="note" style="font-size:11px">${T("photoOnDevice", { kb: nums(Math.round((shot.bytes || 0) / 1024)) })}</div></div>
            <button data-act="photo" data-v="${esc(r.code)}" style="flex:none;padding:9px 10px;font:500 11.5px/1 var(--body)">${T("retake")}</button></div>` : ""}
        </div>`;
      }).join("")}
      </div>

      <div style="margin-top:20px">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="kick">${T("observation")}</span>
          <span style="font:500 11px/1 var(--body);color:${S.note.length > 360 ? "var(--warn)" : "var(--muted)"}">${nums(S.note.length)} / ${nums(400)}</span></div>
        <textarea id="f-note" rows="4" maxlength="400" style="width:100%;resize:none;font:400 14px/1.7 var(--body);padding:12px 13px"
          placeholder="${esc(T("obsPh"))}">${esc(S.note)}</textarea>

      <div class="sticky" style="margin:18px -16px 0">
        <button class="primary" data-act="save">${T("saveReading")}</button>
        <div class="row" style="margin-top:9px"><span class="dot"></span>
          <span style="font:500 11px/1.6 var(--body);color:var(--muted)">${T("offlineSaves")}</span></div>
      </div>
    </div>`;
},

        <div class="kick" style="margin-top:3px">${T("boardSub", { shift: S.session?.shift || "B" })} · ${esc(S.site === "ALL" ? T("allSites") : MASTER.siteLabel(S.site))}</div></div>
      ${chrome()}</div>
    <div class="scroll" style="padding:16px">
      <div style="margin-bottom:14px">${sitePicker()}</div>
      <div class="tiles">
        ${[[T("bExpected"), nums(expected), ""], [T("bCompleted"), nums(done), "color:var(--acc)"],

},

master: () => {
  if (S.mdView === "equipment") return mdList(T("equipmentList"), MASTER.equipment.map(e => ({
    plate: e.tag, title: MASTER.eqName(e), sub: `${MASTER.areaName(e.area)} · ${e.code}`, right: e.nfc.slice(-6), rightSub: "NFC"
  })));
  if (S.mdView === "parameters") {
    const all = [];
    Object.keys(MASTER.params).forEach(k => MASTER.params[k].forEach(p => { if (!all.find(x => x.code === p.code)) all.push(p); }));
    return mdList(T("parameterList"), all.map(p => ({
      plate: p.code, title: MASTER.pName(p),

/* ── Render, preserving focus and caret ────────────────────────────────── */
function render() {
  const a = document.activeElement;
  const key = a && (a.id || a.dataset.p) ? (a.id || "p:" + a.dataset.p) : null;
  const caret = key && a.selectionStart != null ? a.selectionStart : null;
  const sc = el.querySelector(".scroll");
  const top = sc ? sc.scrollTop : 0;

  el.innerHTML = screens[S.screen]() + dialogHtml();

  const ns = el.querySelector(".scroll");
  if (ns) ns.scrollTop = top;
  if (key) {
    const next = key.startsWith("p:") ? el.querySelector(`[data-p="${key.slice(2)}"]`) : el.querySelector("#" + key);
    if (next) { next.focus(); if (caret != null && next.setSelectionRange) try { next.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

/* ── Actions ───────────────────────────────────────────────────────────── */
// Authentication is the shared store's, not the app's — the same account and
// the same password as the web panel, and a deactivated user is refused here.
function doLogin() {
  if (!S.user.trim() || !S.pass) return setS({ touched: true, err: null });
  if (!Core) return setS({ touched: true, err: "bad", errMsg: null });
  let sess;
  try {
    sess = Core.login(S.user, S.pass);
  } catch (e) {
    return setS({ touched: true, err: "bad", errMsg: S.lang === "fa" ? e.messageFa : e.message });
  }
  if (sess.permissions.indexOf("ENTER_READING") < 0 && sess.roleCode !== "ADMINISTRATOR") {
    Core.logout();
    return setS({ touched: true, err: "bad",
      errMsg: S.lang === "fa" ? "این کاربر اجازه ثبت داده ندارد." : "This account cannot record readings." });
  }
  const shift = sess.shiftId ? Core.get("shift", sess.shiftId) : null;
  const session = {
    code: sess.personnelCode,
    name: S.lang === "fa" ? sess.fullNameFa : sess.fullNameEn,
    shift: shift ? shift.shiftCode + " · " + shift.startTime + "–" + shift.endTime : "—",
    mustChange: sess.mustChangePassword
  };
  Native.setSessionUser(session.code, sess.fullNameEn, session.shift);
  Native.tick();
  syncMasterFromCore();
  setS({ session, err: null, errMsg: null, touched: false, pass: "",
         screen: "home", tab: "home", pending: corePending() });
}

function corePending() {
  if (!Core) return Native.pending();
  return Core.pendingRecords().map(r => ({
    id: r.id, tag: r.equipmentTag, submittedAt: Date.parse(r.submittedAt) || Date.now(),
    state: r.syncState, reason: r.syncReason || null
  }));
}
function openEquipment(tag, by) {
  setS({ tag, identifiedBy: by || "SEARCH", values: {}, photos: {}, note: "",
         blocker: null, screen: "entry", unknownUid: null });
}
function doSave() {
  const rows = rowsFor();
  if (!rows.length) { Native.toast(T("noParams")); return; }
  const guard = submitGuard(rows, S);
  if (!guard.ok) {
    const sc = el.querySelector(".scroll"); if (sc) sc.scrollTop = 0;
    return setS({ blocker: guard.message, dialog: false });
  }
  const eq = MASTER.byTag(S.tag), n = Native.now();
  // Snapshot columns match ops.ParameterReading, so the server stores the
  // configuration each value was judged against.
  const readings = rows.filter(r => statusOfRow(r) !== "NOT_ENTERED").map(r => ({
    parameterCode: r.code, parameterId: r.parameterId || null,
    equipmentParameterId: r.epId || null, dataType: r.dataType,
    rawValue: S.values[r.code],
    numericValue: r.dataType === "NUMERIC" ? Number(S.values[r.code]) : null,
    boolValue: r.dataType === "BOOLEAN" ? S.values[r.code] === "true" : null,
    unitSymbol: r.unit || null, normalMin: r.min ?? null, normalMax: r.max ?? null,
    expectedBool: r.expectedBool ?? null,
    validationStatus: statusOfRow(r),
    photo: S.photos[r.code] ? S.photos[r.code].path : null, recordedAt: n.epochMillis
  }));
  const payload = {
    equipmentTag: eq.tag, equipmentCode: eq.code, equipmentNameEn: eq.nameEn, equipmentNameFa: eq.nameFa,
    siteCode: eq.site, equipmentGroupCode: eq.group,
    area: eq.area, identifiedBy: S.identifiedBy,
    personnelCode: S.session?.code, personnelName: "M. Rahimi", shift: S.session?.shift,
    observation: S.note, readings,
    photos: Object.keys(S.photos).map(k => ({ parameterCode: k, ...S.photos[k] })),
    expected: rows.length, abnormal: abnormal(), savedTime: n.time
  };
  let stored;
  if (Core) {
    stored = Core.saveRecord(Object.assign({}, payload, {
      equipmentId: eq.coreId || null,
      readings: readings.map(r => ({
        parameterCode: r.parameterCode, parameterId: r.parameterId || null,
        equipmentParameterId: r.equipmentParameterId || null,
        rawValue: r.rawValue, numericValue: r.numericValue, boolValue: r.boolValue,
        unitSymbol: r.unitSymbol, normalMin: r.normalMin, normalMax: r.normalMax,
        validationStatus: r.validationStatus, recordedAt: r.recordedAt
      }))
    }));
    Native.saveRecord(payload);            // also stage it in app-private storage
  } else {
    stored = Native.saveRecord(payload);
  }
  Native.clearDraft();
  Native.tick();
  const done = { ...S.done }; done[eq.tag] = true;
  syncMasterFromCore();
  const pending = corePending();
  const queued = S.pending.concat([{ id: stored.id, tag: eq.tag, submittedAt: Date.now(), state: "PENDING" }]);
  setS({ saved: { ...payload, ...stored }, screen: "saved", dialog: false, blocker: null, done,
         pending: pending.length ? pending.map(p => ({ ...p, state: p.state || "PENDING" })) : queued });
}

/* Mirrors §H of the architecture: open batch → push records → push photos →
   pull master-data delta → close. Records leave the queue only on ACCEPTED or
   DUPLICATE; the client UUID is what makes a retry a no-op on the server.     */
function doSync() {
  if (S.syncing) return;
  const queue = S.pending.filter(p => p.state !== "SYNCED");
  if (!queue.length) { Native.toast(T("syncQueueEmpty")); return; }
  setS({ syncing: true });

  // Stage 1 will POST to S.serverUrl. Until the API exists, the outcome is
  // simulated so the queue, states and retry path are exercisable on-device.
  setTimeout(() => {
    const now = Native.now();
    const accepted = queue.filter((_, i) => i % 7 !== 6);          // one in seven fails
    const failed = queue.filter((_, i) => i % 7 === 6)
                        .map(p => ({ ...p, state: "FAILED", reason: T("syncNoNet") }));
    if (Core) {
      Core.markSynced(accepted.map(p => p.id));
      if (failed.length) Core.markFailed(failed.map(p => p.id), T("syncNoNet"));
    }
    Native.audit("SYNC_COMPLETED", String(accepted.length));
    Native.tick();
    setS({
      syncing: false,
      pending: Core ? corePending() : failed,
      synced: S.synced + accepted.length,
      failed: failed.length,
      lastSync: now.date + " " + now.time.slice(0, 5)
    });
    Native.toast(T("syncDone", { n: accepted.length }));
  }, 1400);
}

el.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  switch (act) {
    case "toLogin": setS({ screen: "login" }); break;
    case "theme": S.theme = v; applyChrome(); render(); break;
    case "lang": S.lang = S.lang === "en" ? "fa" : "en"; applyChrome(); render(); break;
    case "eye": setS({ showPass: !S.showPass }); break;
    case "login": doLogin(); break;
    case "signout":
      if (Core) Core.logout();
      setS({ screen: "login", session: null, user: "", pass: "", touched: false, err: null, errMsg: null });
      break;
    case "tab": setS({ tab: v, screen: v, mdView: null }); break;
    case "md": setS({ mdView: v }); break;
    case "mdBack": setS({ mdView: null }); break;
    case "scan": setS({ screen: "scan" }); break;
    case "nfcSettings": Native.openNfcSettings(); break;
    case "clearq": setS({ q: "" }); break;
    case "resetq": setS({ q: "", area: "All" }); break;
    case "area": setS({ area: v }); break;
    case "site": setS({ site: v, group: "ALL", area: "All" }); break;
    case "group": setS({ group: v }); break;
    case "bool": {
      const code = v, next = t.dataset.b;
      const cur = S.values[code];
      S.values[code] = cur === next ? "" : next;   // tapping the chosen answer clears it
      S.blocker = null;
      Native.saveDraft({ tag: S.tag, values: S.values, note: S.note });
      render();
      break;
    }
    case "openSync": setS({ tab: "master", screen: "master", mdView: "sync" }); break;
    case "doSync": doSync(); break;
    case "retryFailed": setS({ pending: S.pending.map(p => ({ ...p, state: "PENDING", reason: null })) }); doSync(); break;
    case "open": openEquipment(v, "SEARCH"); break;
    case "dismissUid": setS({ unknownUid: null }); break;
    case "photo": Native.capturePhoto(v); break;
    case "save": doSave(); break;
    case "back":
      if (S.screen === "scan") { setS({ screen: S.tab }); break; }
      if (isDirty()) { const sc = el.querySelector(".scroll"); if (sc) sc.scrollTop = 0; setS({ dialog: true }); }
      else setS({ screen: "search", tab: "search", values: {}, photos: {}, note: "", blocker: null });
      break;
    case "continue": setS({ dialog: false }); break;
    case "discard": Native.clearDraft(); setS({ dialog: false, values: {}, photos: {}, note: "", blocker: null, screen: "search", tab: "search" }); break;
    case "next": setS({ screen: "search", tab: "search", values: {}, photos: {}, note: "", blocker: null, saved: null }); break;
    case "reopen": setS({ screen: "entry", blocker: null }); break;
  }
});

el.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "f-user") { S.user = t.value; return; }
  if (t.id === "f-pass") { S.pass = t.value; return; }
  if (t.id === "f-q") { S.q = t.value; render(); return; }
  if (t.id === "f-note") { S.note = t.value.slice(0, 400); Native.saveDraft({ tag: S.tag, values: S.values, note: S.note }); render(); return; }
  if (t.dataset.p) {
    const row = rowsFor().find(r => r.code === t.dataset.p);
    if (row && row.dataType === "TEXT") {
      S.values[t.dataset.p] = t.value.slice(0, 200);
      Native.saveDraft({ tag: S.tag, values: S.values, note: S.note });
      render();
      return;
    }
    // Normalize Persian digits, filter characters — never reformat or round.
    let clean = t.value.replace(/[۰-۹]/g, d => String(FA_D.indexOf(d)))
                       .replace(/[٫،]/g, ".")
                       .replace(/[^0-9.\-]/g, "");
    if (row && row.min >= 0) clean = clean.replace(/-/g, "");
    const parts = clean.split(".");
    if (parts.length > 2) clean = parts[0] + "." + parts.slice(1).join("");
    S.values[t.dataset.p] = clean;
    Native.saveDraft({ tag: S.tag, values: S.values, note: S.note });
    render();
  }
});

/* ── Native → JS callbacks ─────────────────────────────────────────────── */
window.SepehranNative = {
  onNfcTag(payload) {
    if (S.screen === "splash" || S.screen === "login") { Native.toast(T("signIn")); return; }
    const eq = MASTER.byNfc(payload.uid);
    if (!eq) { setS({ screen: "search", tab: "search", unknownUid: payload.uid }); return; }
    if (S.site !== "ALL" && eq.site !== S.site) S.site = eq.site;   // follow the tag
    openEquipment(eq.tag, "NFC");
  },
  onNfcAvailability(p) { setS({ nfc: p.state }); },
  onPhotoCaptured(p) { S.photos[p.token] = { name: p.name, path: p.path, bytes: p.bytes, sha256: p.sha256 }; S.blocker = null; render(); },
  onPhotoCancelled() { Native.toast(T("addPhoto")); },
  onPhotoDenied() { Native.toast(T("photoRequired")); },
  onBackPressed() {
    if (S.dialog) { setS({ dialog: false }); return true; }
    if (S.screen === "scan") { setS({ screen: S.tab }); return true; }
    if (S.mdView) { setS({ mdView: null }); return true; }
    if (S.screen === "entry") {
      if (isDirty()) { setS({ dialog: true }); return true; }
      setS({ screen: "search", tab: "search" }); return true;
    }
    if (S.screen === "saved") { setS({ screen: "search", tab: "search", saved: null }); return true; }
    if (S.screen !== "home" && S.screen !== "login" && S.screen !== "splash") { setS({ screen: "home", tab: "home" }); return true; }
    if (S.screen === "login") { setS({ screen: "splash" }); return true; }
    return false;   // home exits the app
  }
};

// Boot: adopt the shared store's theme/language, pull master data, and restore
// a live session so the operator is not asked to sign in twice.
if (Core) {
  S.theme = Core.theme() === "dark" ? "night" : Core.theme() === "night" ? "night" : "light";
  S.lang = Core.lang();
  syncMasterFromCore();
  const live = Core.session();
  if (live) {
    const shift = live.shiftId ? Core.get("shift", live.shiftId) : null;
    S.session = {
      code: live.personnelCode,
      name: S.lang === "fa" ? live.fullNameFa : live.fullNameEn,
      shift: shift ? shift.shiftCode + " · " + shift.startTime + "–" + shift.endTime : "—"
    };
    S.screen = "home"; S.tab = "home";
  }
  S.pending = corePending();
  // A change made in the web panel (new equipment, deactivated user) shows here.
  window.addEventListener("storage", ev => {
    if (!ev.key || ev.key.indexOf("sepehran.") !== 0) return;
    syncMasterFromCore();
    if (S.session && !Core.session()) {
      S.session = null; S.screen = "login";
      S.errMsg = S.lang === "fa" ? "دسترسی این حساب لغو شده است." : "This account has been deactivated.";
      S.err = "bad";
    }
    S.pending = corePending();
    render();
  });
}

applyChrome();
render();
</script>
</body>
